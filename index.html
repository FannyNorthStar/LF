<html lang="fr">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --red: #C41E1E;
    --red-dark: #8B0000;
    --gold: #D4A017;
    --gold-light: #F2D06B;
    --cream: #F5E6C8;
    --black: #1A1008;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    min-height: 100vh;
    background: var(--red);
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(0,0,0,0.04) 40px, rgba(0,0,0,0.04) 42px);
    pointer-events: none;
    z-index: 0;
  }
  .poster {
    position: relative;
    z-index: 1;
    max-width: 600px;
    width: 100%;
    background: var(--red-dark);
    border: 6px solid var(--gold);
    outline: 3px solid var(--red-dark);
    outline-offset: 6px;
    text-align: center;
  }
  .header-bar {
    background: var(--gold);
    padding: 14px 20px 10px;
    position: relative;
    z-index: 2;
  }
  .header-bar::after {
    content: '';
    position: absolute;
    bottom: -12px; left: 0; right: 0;
    height: 12px;
    background: repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 8px, transparent 8px, transparent 16px);
  }
  .site-title {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    color: var(--red-dark);
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
  }
  .subtitle {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(0.65rem, 2.2vw, 1rem);
    color: var(--red-dark);
    letter-spacing: clamp(0.08em, 1.5vw, 0.3em);
    text-transform: uppercase;
    opacity: 0.7;
    margin-top: 2px;
  }
  .star-container { padding: 28px 0 8px; }
  .star-container svg {
    width: 64px; height: 64px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }

  /* Quote area — entire block fades */
  .quote-area {
    padding: 12px 32px 20px;
    transition: opacity 0.3s ease;
  }
  .quote-area.fade-out { opacity: 0; }
  .quote-marks {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 3.5rem;
    color: var(--gold);
    line-height: 1;
    opacity: 0.6;
    margin-bottom: -12px;
  }
  .quote-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.05rem, 3vw, 1.35rem);
    font-style: italic;
    font-weight: 400;
    line-height: 1.55;
    color: var(--cream);
    max-width: 480px;
    margin: 0 auto;
    padding: 0 8px;
  }
  .author-block {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 2px solid var(--gold);
    display: inline-block;
  }
  .author-name {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    color: var(--gold-light);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .author-source {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 0.85rem;
    color: var(--cream);
    opacity: 0.55;
    margin-top: 4px;
    font-style: italic;
  }

  /* Buttons */
  .btn-row {
    padding: 8px 20px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .btn-generate {
    background: var(--gold);
    border: none;
    color: var(--red-dark);
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(0.9rem, 2.8vw, 1.25rem);
    letter-spacing: 0.1em;
    padding: 14px 28px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 0 #8B6508;
    position: relative;
    max-width: 100%;
  }
  .btn-generate:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #8B6508;
  }
  .btn-generate:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8B6508;
  }
  .btn-generate:focus-visible {
    outline: 3px solid var(--cream);
    outline-offset: 3px;
  }
  .btn-secondary {
    background: none;
    border: none;
    color: var(--cream);
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s;
    text-transform: uppercase;
    padding: 4px 12px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .btn-secondary:focus-visible {
    outline: 2px solid var(--cream);
    outline-offset: 2px;
  }
  .btn-secondary.visible { opacity: 0.5; }
  .btn-secondary:hover { opacity: 0.8; }
  .btn-copy {
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    padding: 8px 20px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s, opacity 0.2s;
    opacity: 0.6;
  }
  .btn-copy:hover { opacity: 1; }
  .btn-copy:active { background: var(--gold); color: var(--red-dark); }
  .btn-copy:focus-visible {
    outline: 2px solid var(--cream);
    outline-offset: 2px;
  }

  .mode-label {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: var(--cream);
    opacity: 0.45;
    margin-top: 2px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: var(--red-dark);
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    padding: 10px 24px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 100;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .footer-bar {
    background: var(--gold);
    padding: 10px 20px;
    position: relative;
    z-index: 2;
  }
  .footer-bar::before {
    content: '';
    position: absolute;
    top: -12px; left: 0; right: 0;
    height: 12px;
    background: repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 8px, transparent 8px, transparent 16px);
  }
  .footer-text {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(0.6rem, 2vw, 0.85rem);
    color: var(--red-dark);
    letter-spacing: clamp(0.08em, 1vw, 0.25em);
    text-transform: uppercase;
  }
  .day-counter {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 0.75rem;
    color: var(--red-dark);
    opacity: 0.6;
    letter-spacing: 0.15em;
    margin-top: 2px;
  }
  .corner {
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.5;
    z-index: 1;
  }
  .corner.tl { top: 12px; left: 12px; border-width: 3px 0 0 3px; }
  .corner.tr { top: 12px; right: 12px; border-width: 3px 3px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 3px 3px; }
  .corner.br { bottom: 12px; right: 12px; border-width: 0 3px 3px 0; }

  @media (max-width: 480px) {
    .quote-area { padding: 12px 16px 16px; }
    .btn-row { padding: 8px 16px 20px; }
    body { padding: 10px; }
    .poster {
      outline-offset: 3px;
      border-width: 4px;
    }
    .btn-generate { padding: 12px 20px; }
    .star-container svg { width: 48px; height: 48px; }
  }

  @media (max-width: 340px) {
    .site-title { letter-spacing: 0.02em; }
    .poster { outline: none; }
  }
</style>
</head>

<script>
const Q = [
// ═══════ KARL MARX ═══════
{t:"Les philosophes n'ont fait qu'interpréter le monde de différentes manières, ce qui importe c'est de le transformer.",a:"Karl Marx",s:"Thèses sur Feuerbach, 1845"},
{t:"L'histoire de toute société jusqu'à nos jours n'a été que l'histoire de luttes de classes.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"La religion est le soupir de la créature opprimée, l'âme d'un monde sans cœur. Elle est l'opium du peuple.",a:"Karl Marx",s:"Critique de la philosophie du droit de Hegel, 1844"},
{t:"Le capital est du travail mort, qui, semblable au vampire, ne s'anime qu'en suçant le travail vivant.",a:"Karl Marx",s:"Le Capital, Livre I, 1867"},
{t:"De chacun selon ses capacités, à chacun selon ses besoins.",a:"Karl Marx",s:"Critique du programme de Gotha, 1875"},
{t:"Ce n'est pas la conscience des hommes qui détermine leur existence, c'est au contraire leur existence sociale qui détermine leur conscience.",a:"Karl Marx",s:"Contribution à la critique de l'économie politique, 1859"},
{t:"Tout ce qui est solide se volatilise, tout ce qui est sacré est profané.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"L'émancipation des travailleurs sera l'œuvre des travailleurs eux-mêmes.",a:"Karl Marx",s:"Statuts de l'Association Internationale des Travailleurs, 1864"},
{t:"L'histoire se répète, la première fois comme tragédie, la seconde fois comme farce.",a:"Karl Marx",s:"Le 18 Brumaire de Louis Bonaparte, 1852"},
{t:"Les idées dominantes d'une époque n'ont jamais été que les idées de la classe dominante.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"Prolétaires de tous les pays, unissez-vous !",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"L'homme fait sa propre histoire, mais il ne la fait pas de plein gré, dans des circonstances qu'il a lui-même choisies.",a:"Karl Marx",s:"Le 18 Brumaire de Louis Bonaparte, 1852"},
{t:"La tradition de toutes les générations mortes pèse d'un poids très lourd sur le cerveau des vivants.",a:"Karl Marx",s:"Le 18 Brumaire de Louis Bonaparte, 1852"},
{t:"Un spectre hante l'Europe — le spectre du communisme.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"Être radical, c'est prendre les choses par la racine. Or la racine de l'homme, c'est l'homme lui-même.",a:"Karl Marx",s:"Critique de la philosophie du droit de Hegel, 1844"},
{t:"La dépréciation du monde des hommes augmente en raison directe de la mise en valeur du monde des choses.",a:"Karl Marx",s:"Manuscrits de 1844"},
{t:"Le mode de production de la vie matérielle conditionne le processus de vie social, politique et intellectuel en général.",a:"Karl Marx",s:"Contribution à la critique de l'économie politique, 1859"},
{t:"Accumulation de richesse à un pôle signifie accumulation de misère à l'autre pôle.",a:"Karl Marx",s:"Le Capital, Livre I, 1867"},
{t:"Le mort saisit le vif.",a:"Karl Marx",s:"Le Capital, Livre I, 1867"},
{t:"La bourgeoisie a joué dans l'histoire un rôle éminemment révolutionnaire.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"Le travailleur devient d'autant plus pauvre qu'il produit plus de richesse.",a:"Karl Marx",s:"Manuscrits de 1844"},
{t:"La raison a toujours existé, mais pas toujours sous une forme raisonnable.",a:"Karl Marx",s:"Lettre à Arnold Ruge, 1843"},
{t:"Le temps est l'espace du développement humain.",a:"Karl Marx",s:"Discours sur le libre-échange, 1848"},
{t:"Le travail aliéné fait de l'être générique de l'homme un être étranger à lui-même.",a:"Karl Marx",s:"Manuscrits de 1844"},
{t:"La bourgeoisie ne peut exister sans révolutionner constamment les instruments de production.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"Dans la société bourgeoise, le capital est indépendant et personnel, tandis que l'individu qui travaille n'a ni indépendance ni personnalité.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"Le libre développement de chacun est la condition du libre développement de tous.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"La société bourgeoise moderne n'a pas aboli les antagonismes de classes. Elle n'a fait que substituer de nouvelles classes à celles d'autrefois.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"Le luxe est un besoin qui naît de la richesse, et non de la misère.",a:"Karl Marx",s:"Manuscrits de 1844"},
{t:"Le besoin d'une société sans cesse élargie pour ses produits pousse la bourgeoisie sur tout le globe.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
{t:"L'argent est le proxénète entre le besoin et l'objet.",a:"Karl Marx",s:"Manuscrits de 1844"},
{t:"La production capitaliste engendre elle-même sa propre négation avec la fatalité d'un processus naturel.",a:"Karl Marx",s:"Le Capital, Livre I, 1867"},
{t:"Les droits de l'homme ne sont rien d'autre que les droits du membre de la société bourgeoise.",a:"Karl Marx",s:"La Question juive, 1843"},
{t:"La force est l'accoucheuse de toute vieille société en travail.",a:"Karl Marx",s:"Le Capital, Livre I, 1867"},
{t:"Toute la mythologie domine et façonne les forces de la nature dans et par l'imagination.",a:"Karl Marx",s:"Grundrisse, 1858"},
{t:"Il faut rendre l'oppression réelle encore plus oppressante en y ajoutant la conscience de l'oppression.",a:"Karl Marx",s:"Critique de la philosophie du droit de Hegel, 1844"},
{t:"Le philosophe produit des idées, le poète des vers, le pasteur des sermons, le criminaliste des crimes.",a:"Karl Marx",s:"Théories sur la plus-value, 1863"},
{t:"Le gouvernement moderne n'est qu'un comité qui gère les affaires communes de toute la bourgeoisie.",a:"Karl Marx",s:"Manifeste du Parti communiste, 1848"},
// ═══════ FRIEDRICH ENGELS ═══════
{t:"L'État n'est rien d'autre qu'un instrument d'oppression d'une classe par une autre.",a:"Friedrich Engels",s:"L'Origine de la famille, de la propriété privée et de l'État, 1884"},
{t:"La condition de l'émancipation de la classe ouvrière est l'abolition de toute classe.",a:"Friedrich Engels",s:"Principes du communisme, 1847"},
{t:"L'histoire n'est rien que l'activité de l'homme poursuivant ses propres fins.",a:"Friedrich Engels",s:"La Sainte Famille, 1845"},
{t:"La nature est le banc d'épreuve de la dialectique.",a:"Friedrich Engels",s:"Dialectique de la nature, 1883"},
{t:"Un gramme de pratique vaut plus qu'une tonne de théorie.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"Le gouvernement des personnes fait place à l'administration des choses.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"La liberté est la compréhension de la nécessité.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"Les hommes font leur propre histoire, mais dans un milieu donné qui les conditionne.",a:"Friedrich Engels",s:"Lettre à Joseph Bloch, 1890"},
{t:"La situation de la classe ouvrière est la base réelle de la société actuelle.",a:"Friedrich Engels",s:"La Situation de la classe laborieuse en Angleterre, 1845"},
{t:"Chaque pas en avant est une victoire de la science et un coup porté à la croyance en l'autorité.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"La violence n'est que le moyen, le but est l'avantage économique.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"L'État n'existe pas de toute éternité. Il y a eu des sociétés qui se sont passées de lui.",a:"Friedrich Engels",s:"L'Origine de la famille, 1884"},
{t:"La famille monogame est la première forme de famille fondée sur des conditions économiques.",a:"Friedrich Engels",s:"L'Origine de la famille, 1884"},
{t:"Le facteur déterminant en dernier ressort dans l'histoire, c'est la production et la reproduction de la vie immédiate.",a:"Friedrich Engels",s:"L'Origine de la famille, 1884"},
{t:"L'émancipation de la femme a pour condition première la rentrée de tout le sexe féminin dans l'industrie publique.",a:"Friedrich Engels",s:"L'Origine de la famille, 1884"},
{t:"La quantité se transforme en qualité.",a:"Friedrich Engels",s:"Dialectique de la nature, 1883"},
{t:"Sans la grande industrie anglaise, il n'y aurait pas eu de socialisme moderne.",a:"Friedrich Engels",s:"La Situation de la classe laborieuse en Angleterre, 1845"},
{t:"Aucune nation ne peut être libre si elle opprime d'autres nations.",a:"Friedrich Engels",s:"Discours sur la Pologne, 1847"},
{t:"La morale a toujours été une morale de classe.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"L'État s'éteindra de lui-même le jour où il deviendra inutile.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"Le premier acte par lequel l'État se manifeste réellement comme représentant de toute la société est aussi son dernier acte propre.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"Le passage du règne de la nécessité au règne de la liberté, voilà la révolution sociale.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"Les conditions dans lesquelles les hommes produisent et échangent varient de pays à pays.",a:"Friedrich Engels",s:"Principes du communisme, 1847"},
{t:"Toute l'histoire a été une histoire de luttes de classes entre classes exploiteuses et classes exploitées.",a:"Friedrich Engels",s:"Préface au Manifeste, 1883"},
{t:"Le travail a créé l'homme lui-même.",a:"Friedrich Engels",s:"Le Rôle du travail dans la transformation du singe en homme, 1876"},
{t:"La superstition militaire est la dernière forme de la domination.",a:"Friedrich Engels",s:"Anti-Dühring, 1878"},
{t:"L'armée est le principal instrument de la force de l'État.",a:"Friedrich Engels",s:"L'Origine de la famille, 1884"},
// ═══════ LÉON TROTSKI ═══════
{t:"La vie est belle. Que les générations futures la nettoient de tout mal, de toute oppression, de toute violence, et en jouissent pleinement.",a:"Léon Trotski",s:"Testament, 1940"},
{t:"La bureaucratie soviétique a exproprié politiquement le prolétariat.",a:"Léon Trotski",s:"La Révolution trahie, 1936"},
{t:"Celui qui veut la fin ne peut pas répudier les moyens.",a:"Léon Trotski",s:"Leur morale et la nôtre, 1938"},
{t:"La révolution permanente signifie que la révolution ne s'arrête à aucune étape.",a:"Léon Trotski",s:"La Révolution permanente, 1930"},
{t:"Staline n'est que la plus remarquable médiocrité de la bureaucratie soviétique.",a:"Léon Trotski",s:"Ma vie, 1930"},
{t:"L'art n'est pas un miroir que l'on promène le long d'un chemin, c'est un marteau avec lequel on le façonne.",a:"Léon Trotski",s:"Littérature et Révolution, 1924"},
{t:"Sans théorie révolutionnaire, pas de mouvement révolutionnaire.",a:"Léon Trotski",s:"Bilan et perspectives, 1906"},
{t:"La révolution est la locomotive de l'histoire.",a:"Léon Trotski",s:"Résultats et perspectives, 1906"},
{t:"Il n'y a pas de plus grand plaisir au monde que de se mêler d'une révolution.",a:"Léon Trotski",s:"Ma vie, 1930"},
{t:"Le privilège de la médiocrité historique est de mourir dans son lit.",a:"Léon Trotski",s:"Ma vie, 1930"},
{t:"Le stalinisme est avant tout le produit automatique du vieux bolchevisme mais sa négation dialectique.",a:"Léon Trotski",s:"La Révolution trahie, 1936"},
{t:"La puissance de la pensée consiste en ce qu'elle est capable de dépasser les limites de son époque.",a:"Léon Trotski",s:"Histoire de la révolution russe, 1930"},
{t:"Le socialisme a besoin de la démocratie comme le corps humain a besoin d'oxygène.",a:"Léon Trotski",s:"Terrorisme et communisme, 1920"},
{t:"Les vieux ne veulent pas mourir et les jeunes ne peuvent pas encore vivre.",a:"Léon Trotski",s:"Histoire de la révolution russe, 1930"},
{t:"Celui qui se prosterne devant le fait accompli est incapable de préparer l'avenir.",a:"Léon Trotski",s:"Ma vie, 1930"},
{t:"On ne peut pas bâtir le socialisme sur la misère.",a:"Léon Trotski",s:"La Révolution trahie, 1936"},
{t:"Le trait fondamental de toute révolution est l'intervention directe des masses dans les événements historiques.",a:"Léon Trotski",s:"Histoire de la révolution russe, 1930"},
{t:"Toute la vie politique n'est qu'une chaîne ininterrompue de maillons faibles. Tout l'art de la politique consiste à trouver le maillon le plus facile à saisir.",a:"Léon Trotski",s:"Où va la France ?, 1936"},
{t:"La dialectique n'est pas une fiction ni une mystique, mais une science des formes de notre pensée.",a:"Léon Trotski",s:"ABC de la dialectique matérialiste, 1939"},
{t:"La confiance dans la force des idées signifie en même temps la méfiance à l'égard des baïonnettes.",a:"Léon Trotski",s:"Leur morale et la nôtre, 1938"},
{t:"La grande supériorité du prolétariat, c'est qu'il n'a rien à perdre que ses chaînes.",a:"Léon Trotski",s:"Ma vie, 1930"},
{t:"Chaque bureaucrate sait que le chaos est le meilleur moment pour se servir.",a:"Léon Trotski",s:"La Révolution trahie, 1936"},
{t:"L'inégalité est le moteur de la société bourgeoise mais le frein de la société socialiste.",a:"Léon Trotski",s:"La Révolution trahie, 1936"},
{t:"Le marxisme est avant tout une méthode d'analyse.",a:"Léon Trotski",s:"Histoire de la révolution russe, 1930"},
{t:"Un peuple armé qui se connaît lui-même est invincible.",a:"Léon Trotski",s:"Comment la révolution s'est armée, 1923"},
{t:"La défense de la Révolution d'Octobre est la défense du prolétariat mondial.",a:"Léon Trotski",s:"La Révolution permanente, 1930"},
{t:"Les peuples arriérés reprennent à leur compte les conquêtes matérielles et intellectuelles des pays avancés.",a:"Léon Trotski",s:"Histoire de la révolution russe, 1930"},
{t:"On peut être ferme dans ses principes et souple dans ses méthodes.",a:"Léon Trotski",s:"Ma vie, 1930"},
{t:"L'internationalisme n'est pas une abstraction : c'est un fait politique et un acte politique.",a:"Léon Trotski",s:"La Révolution permanente, 1930"},
// ═══════ JEAN-LUC MÉLENCHON ═══════
{t:"La République, c'est moi !",a:"Jean-Luc Mélenchon",s:"Perquisition au siège de LFI, 2018"},
{t:"Qu'ils s'en aillent tous ! Vite, la révolution citoyenne.",a:"Jean-Luc Mélenchon",s:"Titre de son livre, 2010"},
{t:"Prenez le pouvoir !",a:"Jean-Luc Mélenchon",s:"Slogan de campagne présidentielle, 2012"},
{t:"Je ne suis pas un homme dangereux. Mais je suis l'homme d'un programme dangereux pour les privilégiés.",a:"Jean-Luc Mélenchon",s:"Meeting de Marseille, 2012"},
{t:"L'avenir en commun !",a:"Jean-Luc Mélenchon",s:"Programme de campagne, 2017"},
{t:"La Sixième République, c'est le peuple qui décide de tout.",a:"Jean-Luc Mélenchon",s:"Convention pour la 6e République, 2014"},
{t:"Ma patrie, c'est la langue française.",a:"Jean-Luc Mélenchon",s:"L'Ère du peuple, 2014"},
{t:"La mer monte ! Et avec elle le peuple !",a:"Jean-Luc Mélenchon",s:"Meeting de Marseille, 2017"},
{t:"Je ne me résigne à rien. Jamais.",a:"Jean-Luc Mélenchon",s:"Discours du soir du premier tour, 2017"},
{t:"Le peuple est souverain en démocratie, pas les marchés.",a:"Jean-Luc Mélenchon",s:"Discours à l'Assemblée nationale, 2017"},
{t:"La France, c'est un programme politique universel. C'est les droits de l'homme.",a:"Jean-Luc Mélenchon",s:"Meeting de Toulouse, 2017"},
{t:"On ne négocie pas avec la Terre. On ne négocie pas avec la physique.",a:"Jean-Luc Mélenchon",s:"Discours sur le climat, 2019"},
{t:"Le drapeau tricolore et le drapeau rouge, c'est la même histoire.",a:"Jean-Luc Mélenchon",s:"Meeting Place de la République, 2016"},
{t:"La force du peuple est plus grande que les gens au pouvoir.",a:"Jean-Luc Mélenchon",s:"Meeting de Lille, 2017"},
{t:"Je ne suis le domestique d'aucune puissance étrangère.",a:"Jean-Luc Mélenchon",s:"Discours de campagne, 2017"},
{t:"Le bruit et la fureur ne sont pas un programme.",a:"Jean-Luc Mélenchon",s:"Discours à l'Assemblée nationale, 2018"},
{t:"Le peuple français est un peuple de révolutionnaires.",a:"Jean-Luc Mélenchon",s:"Discours de la Place de la République, 2016"},
{t:"Quand tout le monde triche, ce n'est pas de la triche, c'est le système.",a:"Jean-Luc Mélenchon",s:"Blog personnel, 2016"},
{t:"La créolisation du monde est notre avenir.",a:"Jean-Luc Mélenchon",s:"L'Ère du peuple, 2014"},
{t:"L'union populaire, c'est le contraire du chef qui a toujours raison.",a:"Jean-Luc Mélenchon",s:"Meeting de campagne, 2022"},
{t:"Le capitalisme financier ne connaît ni patrie ni loi, sinon celle du profit.",a:"Jean-Luc Mélenchon",s:"Discours au Parlement européen, 2010"},
{t:"La République est sociale ou elle n'est pas.",a:"Jean-Luc Mélenchon",s:"Discours de campagne, 2012"},
{t:"L'écologie populaire, c'est quand tout le monde mange bien, pas seulement ceux qui ont les moyens.",a:"Jean-Luc Mélenchon",s:"Meeting de Rennes, 2022"},
{t:"Je ne suis candidat à rien d'autre qu'à l'intérêt général humain.",a:"Jean-Luc Mélenchon",s:"Discours de campagne, 2022"},
{t:"Nous ne sommes pas une parenthèse de l'histoire. Nous sommes l'histoire.",a:"Jean-Luc Mélenchon",s:"Meeting du 18 mars, Place de la République, 2017"},
{t:"L'urgence écologique ne se négocie pas. Elle s'impose.",a:"Jean-Luc Mélenchon",s:"Meeting de Nantes, 2022"},
{t:"La dette publique est le prétexte permanent à la liquidation des services publics.",a:"Jean-Luc Mélenchon",s:"Discours à l'Assemblée nationale, 2019"},
{t:"Le partage des richesses est la condition de la paix sociale.",a:"Jean-Luc Mélenchon",s:"Meeting de Lyon, 2017"},
{t:"L'école publique est le cœur battant de la République.",a:"Jean-Luc Mélenchon",s:"Meeting de Lille, 2022"},
{t:"L'eau, l'air, la terre : rien de tout cela n'est une marchandise.",a:"Jean-Luc Mélenchon",s:"L'Avenir en commun, 2017"},
{t:"Le vote est l'arme de ceux qui n'en ont pas d'autre.",a:"Jean-Luc Mélenchon",s:"Meeting de Marseille, 2022"},
{t:"Tout gouvernement qui ne rend pas compte au peuple de ses actes est un gouvernement de tyrans.",a:"Jean-Luc Mélenchon",s:"Discours à l'Assemblée nationale, 2020"},
// ═══════ PIERRE-JOSEPH PROUDHON ═══════
{t:"La propriété, c'est le vol !",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"L'anarchie, c'est l'ordre sans le pouvoir.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"Être gouverné, c'est être gardé à vue, inspecté, espionné, dirigé, légiféré, réglementé, parqué.",a:"Pierre-Joseph Proudhon",s:"Idée générale de la Révolution au XIXe siècle, 1851"},
{t:"La liberté est la mère de l'ordre, non sa fille.",a:"Pierre-Joseph Proudhon",s:"Solution du problème social, 1848"},
{t:"Le gouvernement de l'homme par l'homme, sous quelque nom qu'il se déguise, est oppression.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"L'humanité procède par approximation.",a:"Pierre-Joseph Proudhon",s:"Philosophie de la misère, 1846"},
{t:"Quiconque met la main sur moi pour me gouverner est un usurpateur et un tyran.",a:"Pierre-Joseph Proudhon",s:"Confessions d'un révolutionnaire, 1849"},
{t:"Le propriétaire qui ne cultive pas sa terre est un voleur.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"La justice est le respect spontanément éprouvé et réciproquement garanti de la dignité humaine.",a:"Pierre-Joseph Proudhon",s:"De la justice dans la Révolution et dans l'Église, 1858"},
{t:"Multiplier les lois, c'est multiplier les occasions de les violer.",a:"Pierre-Joseph Proudhon",s:"Idée générale de la Révolution, 1851"},
{t:"La société trouve son plus haut perfectionnement dans l'union de l'ordre et de l'anarchie.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"L'association libre est la vraie forme de la société.",a:"Pierre-Joseph Proudhon",s:"Idée générale de la Révolution, 1851"},
{t:"Prouver le droit, c'est prouver la justice.",a:"Pierre-Joseph Proudhon",s:"De la justice dans la Révolution et dans l'Église, 1858"},
{t:"Le travail est la source de toute valeur.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"L'ordre naît de l'association libre, non de la contrainte.",a:"Pierre-Joseph Proudhon",s:"Du principe fédératif, 1863"},
{t:"Plus de gouvernements, plus de conquêtes, plus de douanes, plus d'exploitation internationale.",a:"Pierre-Joseph Proudhon",s:"Du principe fédératif, 1863"},
{t:"La démocratie, c'est la démopédie : l'éducation du peuple par le peuple.",a:"Pierre-Joseph Proudhon",s:"De la justice, 1858"},
{t:"La propriété est impossible sans un système de contrainte.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"Le peuple n'a jamais eu qu'un seul ennemi, le gouvernement.",a:"Pierre-Joseph Proudhon",s:"Confessions d'un révolutionnaire, 1849"},
{t:"Sous le gouvernement représentatif, l'électeur nomme son député pour ne plus avoir à penser.",a:"Pierre-Joseph Proudhon",s:"Idée générale de la Révolution, 1851"},
{t:"Le suffrage universel est la contre-révolution.",a:"Pierre-Joseph Proudhon",s:"Solution du problème social, 1848"},
{t:"Le communisme est l'exploitation du fort par le faible.",a:"Pierre-Joseph Proudhon",s:"Qu'est-ce que la propriété ?, 1840"},
{t:"La liberté n'est pas la fille mais la mère de l'ordre.",a:"Pierre-Joseph Proudhon",s:"Confessions d'un révolutionnaire, 1849"},
{t:"Le peuple ne fait de révolution que quand il n'y a plus moyen de faire autrement.",a:"Pierre-Joseph Proudhon",s:"Confessions d'un révolutionnaire, 1849"},
{t:"Le contrat social est l'acte suprême par lequel chaque citoyen engage envers la société sa liberté.",a:"Pierre-Joseph Proudhon",s:"Du principe fédératif, 1863"},
{t:"L'égalité est le fondement de toute liberté réelle.",a:"Pierre-Joseph Proudhon",s:"De la justice, 1858"},
// ═══════ LOUISE MICHEL ═══════
{t:"Je suis ambitieuse pour l'humanité. Moi, je voudrais que tout le monde fût artiste, assez poète pour que la vanité humaine disparût.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"C'est que le pouvoir est maudit et c'est pour cela que je suis anarchiste.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Si les cœurs des femmes faiblissaient, il ne resterait plus qu'à tuer la liberté.",a:"Louise Michel",s:"Discours au procès de 1883"},
{t:"Nous ne voulons pas la guerre mais nous ne la craignons pas.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Le rêve de la Commune est le rêve de l'humanité entière.",a:"Louise Michel",s:"La Commune, histoire et souvenirs, 1898"},
{t:"Il y a des heures dans l'humanité qui portent en elles la vie ou la mort des peuples.",a:"Louise Michel",s:"La Commune, 1898"},
{t:"Tout pouvoir porte en lui un germe de mort.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"La Révolution sera la floraison de l'humanité comme l'amour est la floraison du cœur.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Qu'on me donne la mort ou qu'on me donne la liberté ; entre les deux, je ne veux rien.",a:"Louise Michel",s:"Procès devant le Conseil de guerre, 1871"},
{t:"Si vous n'êtes pas des lâches, tuez-moi !",a:"Louise Michel",s:"Procès de 1871"},
{t:"Chacun cherche sa route ; nous cherchons la nôtre et nous pensons que le jour où le règne de la liberté sera arrivé, le genre humain sera heureux.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Les révolutions sont la preuve que le peuple ne se résigne pas.",a:"Louise Michel",s:"La Commune, 1898"},
{t:"Nous avons droit à la science et au pain.",a:"Louise Michel",s:"Discours au procès de 1883"},
{t:"L'anarchie est la plus haute expression de l'ordre.",a:"Louise Michel",s:"Discours, 1882"},
{t:"Je suis avec ceux qui souffrent, quels qu'ils soient.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Chaque être a le droit au pain comme à la vie.",a:"Louise Michel",s:"Prise de possession, 1890"},
{t:"L'éducation est la clef de l'avenir.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Il faut que les femmes soient les égales des hommes, et elles le seront.",a:"Louise Michel",s:"Discours au procès de 1883"},
{t:"La banqueroute est le mot d'ordre de la politique humaine.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Il viendra un temps où tout ce que l'humanité a souffert ne sera plus qu'un souvenir lointain.",a:"Louise Michel",s:"La Commune, 1898"},
{t:"Les femmes de la Commune ont prouvé que le courage n'a pas de sexe.",a:"Louise Michel",s:"La Commune, 1898"},
{t:"Le peuple ne veut plus de dieux, plus de maîtres.",a:"Louise Michel",s:"Discours, 1882"},
{t:"Je porte en moi l'insurrection permanente.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Paris n'est pas une ville, c'est un monde.",a:"Louise Michel",s:"La Commune, 1898"},
{t:"L'amour de l'humanité est la seule religion qui vaille.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"C'est dans l'ombre que se prépare la lumière.",a:"Louise Michel",s:"Mémoires, 1886"},
{t:"Je ne veux ni gouverner ni être gouvernée.",a:"Louise Michel",s:"Mémoires, 1886"},
// ═══════ MIKHAÏL BAKOUNINE ═══════
{t:"La liberté des autres étend la mienne à l'infini.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Si Dieu existait réellement, il faudrait le faire disparaître.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Toute autorité temporaire devient vite tyrannique.",a:"Mikhaïl Bakounine",s:"Étatisme et Anarchie, 1873"},
{t:"La passion de la destruction est en même temps une passion créatrice.",a:"Mikhaïl Bakounine",s:"La Réaction en Allemagne, 1842"},
{t:"Là où commence l'État, la liberté individuelle cesse, et inversement.",a:"Mikhaïl Bakounine",s:"Fédéralisme, socialisme et antithéologisme, 1867"},
{t:"Les doctrinaires, les professeurs et tous les faiseurs de systèmes veulent le despotisme de la science.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Je ne suis véritablement libre que lorsque tous les êtres humains qui m'entourent sont également libres.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Nous sommes des matérialistes convaincus et des ennemis déclarés de toute idéologie.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Le peuple se révoltera spontanément, par la seule force des choses.",a:"Mikhaïl Bakounine",s:"Lettres à un Français, 1870"},
{t:"Prenez le plus radical des révolutionnaires, placez-le sur le trône de toutes les Russies, et il deviendra pire que le tsar lui-même.",a:"Mikhaïl Bakounine",s:"Correspondance, 1870"},
{t:"L'État est la force organisée de la classe possédante.",a:"Mikhaïl Bakounine",s:"Étatisme et Anarchie, 1873"},
{t:"La révolution sociale doit être l'œuvre collective des masses.",a:"Mikhaïl Bakounine",s:"Lettres à un Français, 1870"},
{t:"L'instruction intégrale est le seul moyen de réaliser l'égalité.",a:"Mikhaïl Bakounine",s:"L'instruction intégrale, 1869"},
{t:"L'homme n'est vraiment libre qu'au milieu d'hommes libres.",a:"Mikhaïl Bakounine",s:"Fédéralisme, socialisme et antithéologisme, 1867"},
{t:"Tout État est une tyrannie, qu'il soit monarchique ou républicain.",a:"Mikhaïl Bakounine",s:"Étatisme et Anarchie, 1873"},
{t:"Trois choses constituent les éléments essentiels de toute vie humaine : la pensée, le travail et la révolte.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"La théologie est la science du mensonge divin.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"La première révolte de l'homme est contre l'injustice suprême de la nature.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"La science ne doit imposer rien. Elle doit expliquer.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"L'égalité sans la liberté, c'est le despotisme de l'État.",a:"Mikhaïl Bakounine",s:"Étatisme et Anarchie, 1873"},
{t:"Les législateurs et les fondateurs d'États sont les plus grands imposteurs de l'histoire.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Le privilège est l'ennemi mortel du droit.",a:"Mikhaïl Bakounine",s:"Fédéralisme, socialisme et antithéologisme, 1867"},
{t:"L'instinct de révolte est un fait aussi naturel que l'instinct de conservation.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"Toute religion est un appauvrissement de l'humanité.",a:"Mikhaïl Bakounine",s:"Dieu et l'État, 1882"},
{t:"L'État centralisé est la négation de la liberté.",a:"Mikhaïl Bakounine",s:"Étatisme et Anarchie, 1873"},
// ═══════ ANTONIO GRAMSCI ═══════
{t:"Le vieux monde se meurt, le nouveau monde tarde à apparaître et dans ce clair-obscur surgissent les monstres.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Je suis pessimiste par l'intelligence, mais optimiste par la volonté.",a:"Antonio Gramsci",s:"Lettres de prison, 1929"},
{t:"L'indifférence est le poids mort de l'histoire.",a:"Antonio Gramsci",s:"La Città futura, 1917"},
{t:"La crise consiste justement dans le fait que l'ancien meurt et que le nouveau ne peut pas naître.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Tout homme est intellectuel, mais tout homme n'a pas dans la société la fonction d'intellectuel.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"L'hégémonie naît dans l'usine.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Instruisez-vous, car nous aurons besoin de toute notre intelligence.",a:"Antonio Gramsci",s:"L'Ordine Nuovo, 1919"},
{t:"Agitez-vous, car nous aurons besoin de tout votre enthousiasme.",a:"Antonio Gramsci",s:"L'Ordine Nuovo, 1919"},
{t:"Organisez-vous, car nous aurons besoin de toute votre force.",a:"Antonio Gramsci",s:"L'Ordine Nuovo, 1919"},
{t:"Je hais les indifférents.",a:"Antonio Gramsci",s:"La Città futura, 1917"},
{t:"L'histoire enseigne, mais elle n'a pas d'élèves.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"L'État est tout l'ensemble des activités pratiques et théoriques grâce auxquelles la classe dirigeante justifie et maintient sa domination.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Vivre signifie être partisan. L'indifférence est apathie, est parasitisme.",a:"Antonio Gramsci",s:"La Città futura, 1917"},
{t:"La vérité est révolutionnaire.",a:"Antonio Gramsci",s:"L'Ordine Nuovo, 1919"},
{t:"Le sens commun est le folklore de la philosophie.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Il faut avoir une conception critique de soi-même, obtenue à travers une élaboration historique.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"On ne peut pas séparer l'homo faber de l'homo sapiens.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Chaque rapport d'hégémonie est nécessairement un rapport pédagogique.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"La conquête du pouvoir culturel précède la conquête du pouvoir politique.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Le bon sens est la philosophie spontanée de tout le monde.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"La philosophie de la praxis est la philosophie de l'action.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"L'erreur de l'intellectuel consiste à croire qu'on puisse savoir sans comprendre.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Toute relation de pouvoir implique au moins la possibilité de la résistance.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"Le langage est aussi un pouvoir.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
{t:"L'intellectuel traditionnel se croit autonome et indépendant du groupe social dominant.",a:"Antonio Gramsci",s:"Cahiers de prison, 1929–1935"},
// ═══════ ANGELA DAVIS ═══════
{t:"Je ne suis plus disposée à accepter les choses que je ne peux pas changer. Je change les choses que je ne peux pas accepter.",a:"Angela Davis",s:"Autobiographie, 1974"},
{t:"Les murs de la prison transforment en révolutionnaire quiconque est enfermé entre eux.",a:"Angela Davis",s:"Si ils frappent à l'aube, 1971"},
{t:"La liberté est une lutte constante.",a:"Angela Davis",s:"La liberté est une lutte constante, 2016"},
{t:"Il ne suffit pas de ne pas être raciste, il faut être antiraciste.",a:"Angela Davis",s:"Femmes, race et classe, 1981"},
{t:"Quand on est convaincu d'avoir raison, on n'a pas peur d'aller en prison.",a:"Angela Davis",s:"Autobiographie, 1974"},
{t:"Les prisons ne font pas disparaître les problèmes, elles font disparaître les êtres humains.",a:"Angela Davis",s:"Les Goulags de la démocratie, 2003"},
{t:"Le féminisme est un mouvement pour mettre fin au sexisme, à l'exploitation sexiste et à l'oppression.",a:"Angela Davis",s:"Femmes, race et classe, 1981"},
{t:"Radical signifie simplement prendre les choses par la racine.",a:"Angela Davis",s:"Discours, 1971"},
{t:"La nourriture que vous mangez est politique.",a:"Angela Davis",s:"Conférence au Grace Cathedral, 2014"},
{t:"Le racisme ne peut être séparé du capitalisme.",a:"Angela Davis",s:"Femmes, race et classe, 1981"},
{t:"On ne peut pas lutter pour la liberté de certains en ignorant l'oppression des autres.",a:"Angela Davis",s:"La liberté est une lutte constante, 2016"},
{t:"Nous devons toujours tenter de faire ce qui semble impossible.",a:"Angela Davis",s:"La liberté est une lutte constante, 2016"},
{t:"La solidarité est le premier pas vers la justice.",a:"Angela Davis",s:"Conférence, 2019"},
{t:"L'histoire des luttes est notre plus grande source d'espoir.",a:"Angela Davis",s:"La liberté est une lutte constante, 2016"},
{t:"Nous devons imaginer le type de société dans laquelle nous voulons vivre.",a:"Angela Davis",s:"Les Goulags de la démocratie, 2003"},
{t:"Il n'y a pas de voie rapide vers la liberté.",a:"Angela Davis",s:"La liberté est une lutte constante, 2016"},
{t:"La justice n'est pas un produit fini. C'est un processus.",a:"Angela Davis",s:"Conférence, 2015"},
{t:"On ne peut pas construire un mouvement fondé sur la peur.",a:"Angela Davis",s:"La liberté est une lutte constante, 2016"},

let currentIdx = -1;

function getDayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / (1000 * 60 * 60 * 24));
}

function display(q, animate) {
  const area = document.getElementById('quote-area');
  if (animate) {
    area.classList.add('fade-out');
    setTimeout(() => {
      setContent(q);
      area.classList.remove('fade-out');
    }, 280);
  } else {
    setContent(q);
  }
}

function setContent(q) {
  document.getElementById('quote').textContent = q.t;
  document.getElementById('author').textContent = q.a;
  document.getElementById('source').textContent = q.s;
}

function showDaily() {
  currentIdx = getDayOfYear() % Q.length;
  display(Q[currentIdx], false);
  const today = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  const dateStr = today.toLocaleDateString('fr-FR', opts);
  document.getElementById('day-counter').textContent = 'Édition du ' + dateStr + ' · Citation nº ' + (currentIdx + 1) + '/' + Q.length;
  document.getElementById('mode-label').textContent = '— citation du jour —';
  document.getElementById('btn-daily').classList.remove('visible');
}

function generate() {
  let idx;
  do { idx = Math.floor(Math.random() * Q.length); } while (idx === currentIdx && Q.length > 1);
  currentIdx = idx;
  display(Q[idx], true);
  document.getElementById('mode-label').textContent = '— citation aléatoire —';
  document.getElementById('btn-daily').classList.add('visible');
}

function backToDaily() {
  showDaily();
}

function copyQuote() {
  const q = Q[currentIdx];
  const text = '« ' + q.t + ' »\n— ' + q.a + ', ' + q.s;
  navigator.clipboard.writeText(text).then(() => {
    showToast('Citation copiée, camarade !');
  }).catch(() => {
    showToast('Erreur bourgeoise détectée');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

showDaily();
document.getElementById('btn-generate').addEventListener('click', generate);
document.getElementById('btn-daily').addEventListener('click', backToDaily);
document.getElementById('btn-copy').addEventListener('click', copyQuote);
</script>
